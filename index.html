<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Bulk Log">
<meta name="theme-color" content="#0F0F12">
<title>Bulk Log</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; background: #0F0F12; color: #E8E6E1; font-family: -apple-system, 'Inter', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); }
  input, textarea, button { font-family: inherit; -webkit-appearance: none; appearance: none; }
  input[type=number]::-webkit-inner-spin-button, input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  button { cursor: pointer; }

  #app { display: flex; flex-direction: column; min-height: 100vh; }

  .header { flex-wrap: wrap; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #18181C; border-bottom: 1px solid #2A2A30; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  .header-sub { font-size: 11px; letter-spacing: 3px; color: #888; text-transform: uppercase; margin-bottom: 2px; }
  .header-week { font-size: 17px; font-weight: 700; }
  .header-btns { display: flex; gap: 6px; flex-wrap: wrap; }
  .tab-btn { padding: 6px 14px; border-radius: 6px; border: none; font-size: 13px; font-weight: 600; }
  .tab-active { background: #E8E6E1; color: #0F0F12; }
  .tab-inactive { background: #2A2A30; color: #888; }

  .day-strip { display: flex; gap: 6px; padding: 12px 16px; overflow-x: auto; background: #18181C; border-bottom: 1px solid #2A2A30; flex-shrink: 0; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; padding: 8px 10px; border-radius: 8px; border: 2px solid transparent; background: #141418; text-align: center; min-width: 60px; position: relative; }
  .day-btn-active { border-color: var(--dc); background: color-mix(in srgb, var(--dc) 13%, transparent); }
  .day-btn-logged::after { content: ''; position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: #27AE60; }
  .day-lbl { font-size: 10px; color: #666; margin-bottom: 2px; }
  .day-lbl-today { color: #F0A500; font-weight: 700; }
  .day-ico { font-size: 16px; }
  .day-nm { font-size: 10px; color: #666; margin-top: 2px; font-weight: 600; }
  .day-btn-active .day-nm { color: var(--dc); }
  .day-btn-swap-src { border-color: #F0A500 !important; background: #F0A50022 !important; }
  .day-btn-swap-target { border-color: #27AE60 !important; background: #27AE6022 !important; animation: pulse 0.8s infinite alternate; }
  @keyframes pulse { from { opacity: 0.7; } to { opacity: 1; } }
  .swap-day-hint { font-size: 11px; color: #F0A500; text-align: center; padding: 6px 16px; background: #F0A50011; border-bottom: 1px solid #F0A50033; flex-shrink: 0; }

  .sess-hdr { padding: 14px 20px; border-bottom: 1px solid #2A2A30; display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
  .sess-ico { width: 42px; height: 42px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 22px; }
  .sess-title { font-size: 18px; font-weight: 700; }
  .sess-muscles { font-size: 12px; color: #888; margin-top: 1px; }

  .content { flex: 1; padding: 16px 20px 60px; }

  /* Exercise card */
  .ex-card { background: #18181C; border-radius: 10px; padding: 14px; margin-bottom: 12px; border: 1px solid #2A2A30; transition: opacity 0.15s; position: relative; }
  .ex-card.dragging { opacity: 0.4; }
  .ex-card.drag-over { border-color: #4A9EBF; }

  .ex-top-row { display: flex; gap: 8px; margin-bottom: 6px; align-items: center; }
  .drag-handle { color: #444; font-size: 18px; padding: 4px 6px; cursor: grab; flex-shrink: 0; touch-action: none; user-select: none; }
  .drag-handle:active { cursor: grabbing; color: #888; }
  .ex-name-inp { flex: 1; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 7px; color: #E8E6E1; padding: 9px 12px; font-size: 14px; font-weight: 600; width: 100%; }
  .gym-pick { display: flex; gap: 6px; align-items: center; margin-bottom: 12px; }
  .gym-btn { padding: 6px 12px; border-radius: 6px; border: 1px solid #2A2A30; background: #18181C; color: #888; font-size: 12px; font-weight: 600; }
  .gym-btn-on { background: #E8E6E1; color: #0F0F12; border-color: #E8E6E1; }
  .run-status { font-size: 12px; color: #666; white-space: nowrap; font-weight: 600; }
  .run-done { color: #27AE60; }
  .run-row { padding: 10px 0 10px 10px; border-top: 1px solid #2A2A30; border-left: 3px solid #27AE60; margin-top: 2px; }
  .run-warn { border-left-color: #F0A500; }
  .run-bad { border-left-color: #C0392B; }
  .run-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .run-note { font-size: 12px; color: #C8C6C0; margin-top: 4px; }
  .vol-row { display: grid; grid-template-columns: 52px 1fr 60px; gap: 8px; align-items: center; padding: 5px 0; }
  .vol-lbl, .vol-km { font-size: 12px; color: #888; }
  .vol-km { text-align: right; }
  .vol-bar { height: 10px; background: #0F0F12; border-radius: 5px; overflow: hidden; }
  .vol-fill { height: 100%; background: #4A9EBF; border-radius: 5px; }
  .ex-note { font-size: 11px; color: #888; margin: -2px 0 8px 34px; }
  .ex-setup { margin: -2px 0 8px 34px; }
  .setup-btn { display: block; width: 100%; text-align: left; background: none; border: 1px dashed #2A2A30; border-radius: 6px; color: #666; font-size: 12px; padding: 5px 8px; white-space: pre-wrap; word-break: break-word; }
  .setup-btn.setup-has { border: 1px solid #F0A50044; background: #F0A50012; color: #E8C27A; }
  .setup-ta { width: 100%; background: #0F0F12; border: 1px solid #F0A50066; border-radius: 6px; color: #E8E6E1; padding: 7px 9px; font-size: 13px; resize: vertical; display: block; }
  .setup-done { margin-top: 5px; font-size: 11px; color: #F0A500; background: none; border: 1px solid #F0A50055; border-radius: 5px; padding: 3px 12px; font-weight: 600; }
  .ex-rm { background: none; border: none; color: #444; font-size: 18px; padding: 4px 6px; flex-shrink: 0; }

  /* Rep range + RPE target row */
  .ex-config-row { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .ex-config-label { font-size: 10px; color: #666; text-transform: uppercase; letter-spacing: 1px; flex-shrink: 0; }
  .range-inp { width: 44px; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 5px; color: #F0A500; padding: 4px 6px; font-size: 12px; font-weight: 700; text-align: center; }
  .range-sep { font-size: 12px; color: #555; }
  .rpe-target-inp { width: 44px; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 5px; color: #7D3C98; padding: 4px 6px; font-size: 12px; font-weight: 700; text-align: center; }
  .ex-actions { display: flex; gap: 6px; margin-left: auto; }
  .swap-btn { font-size: 11px; color: #4A9EBF; background: none; border: 1px solid #2A4A5A; border-radius: 5px; padding: 3px 9px; font-weight: 600; flex-shrink: 0; }

  .hint { border-radius: 7px; padding: 8px 10px; margin-bottom: 10px; display: flex; gap: 7px; }
  .hint-type { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 2px; }
  .hint-msg { font-size: 12px; color: #C8C6C0; }
  .last-ref { font-size: 11px; color: #555; margin-bottom: 10px; }

  .swap-panel { background: #0F0F12; border-radius: 8px; padding: 10px; margin-bottom: 12px; border: 1px solid #2A4A5A; }
  .swap-title { font-size: 11px; color: #888; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; }
  .swap-opt { display: block; width: 100%; text-align: left; background: none; border: none; border-bottom: 1px solid #1A2A30; color: #C8E6F0; font-size: 13px; padding: 8px 0; }
  .swap-opt:last-child { border-bottom: none; }
  .swap-opt-top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .swap-opt-name { font-weight: 600; }
  .swap-opt-tgt { font-size: 11px; color: #F0A500; white-space: nowrap; }
  .swap-opt-last { font-size: 11px; color: #888; margin-top: 2px; }
  .hint-src { font-size: 11px; color: #888; margin-top: 3px; }
  .ex-vid { color: #C0392B; font-size: 14px; text-decoration: none; padding: 6px 8px; border: 1px solid #2A2A30; border-radius: 7px; flex-shrink: 0; line-height: 1; }
  .backup-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 6px; }
  .backup-btn { padding: 11px; border-radius: 10px; background: #1E1E24; border: 1px solid #2A2A30; color: #C8C6C0; font-size: 13px; font-weight: 600; }
  .backup-note { font-size: 11px; color: #666; margin-bottom: 16px; text-align: center; }

  /* Sets — now 5 columns: set# | kg | reps | rpe | del */
  .sets-hdr { display: grid; grid-template-columns: 28px 1fr 1fr 48px 28px; gap: 5px; margin-bottom: 6px; }
  .sets-hdr span { font-size: 10px; color: #555; text-align: center; }
  .set-row { display: grid; grid-template-columns: 28px 1fr 1fr 48px 28px; gap: 5px; margin-bottom: 6px; align-items: center; }
  .set-num { font-size: 12px; color: #666; text-align: center; font-weight: 700; }
  .set-inp { background: #0F0F12; border: 1px solid #2A2A30; border-radius: 6px; color: #E8E6E1; padding: 7px 4px; font-size: 13px; text-align: center; width: 100%; }
  .set-rpe { background: #0F0F12; border: 1px solid #2A2A30; border-radius: 6px; color: #B088D0; padding: 7px 4px; font-size: 13px; text-align: center; width: 100%; }
  .set-rm { background: none; border: none; color: #444; font-size: 13px; width: 100%; }
  .add-set-btn { width: 100%; margin-top: 6px; padding: 7px; background: none; border: 1px dashed #2A2A30; border-radius: 6px; color: #555; font-size: 12px; }
  .add-ex-btn { width: 100%; padding: 11px; background: none; border: 1px dashed #3A3A44; border-radius: 8px; color: #888; font-size: 13px; font-weight: 600; margin-bottom: 14px; }

  .fld-lbl { font-size: 11px; color: #888; margin-bottom: 6px; letter-spacing: 1px; text-transform: uppercase; }
  .fld-inp { width: 100%; background: #1E1E24; border: 1px solid #2A2A30; border-radius: 8px; color: #E8E6E1; padding: 10px 12px; font-size: 15px; }
  .run-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .notes-ta { width: 100%; background: #1E1E24; border: 1px solid #2A2A30; border-radius: 8px; color: #E8E6E1; padding: 10px 12px; font-size: 13px; min-height: 70px; resize: vertical; }
  .auto-saved-indicator { margin-top: 20px; padding: 12px; border-radius: 10px; background: #1A2A1A; border: 1px solid #27AE6044; color: #27AE60; font-size: 13px; font-weight: 600; text-align: center; }

  /* Rest timer overlay */
  .rest-overlay { position: fixed; bottom: 0; left: 0; right: 0; background: #18181C; border-top: 2px solid #2A2A30; padding: 16px 20px 24px; display: flex; align-items: center; gap: 14px; z-index: 100; transform: translateY(100%); transition: transform 0.3s ease; box-shadow: 0 -4px 20px #00000088; }
  .rest-overlay.active { transform: translateY(0); }
  .rest-ring { position: relative; width: 60px; height: 60px; flex-shrink: 0; }
  .rest-ring svg { transform: rotate(-90deg); width: 60px; height: 60px; }
  .rest-ring-track { fill: none; stroke: #2A2A30; stroke-width: 5; }
  .rest-ring-fill { fill: none; stroke: #4A9EBF; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.9s linear; }
  .rest-ring-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 800; color: #E8E6E1; }
  .rest-info { flex: 1; min-width: 0; }
  .rest-label { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 3px; }
  .rest-sound { margin-top: 4px; background: #F0A50018; border: 1px solid #F0A50055; color: #F0A500; border-radius: 6px; padding: 3px 8px; font-size: 11px; font-weight: 600; }
  .rest-sound[hidden] { display: none; }
  .rest-ex-name { font-size: 13px; font-weight: 600; color: #E8E6E1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rest-actions { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }
  .rest-skip { background: #C0392B22; border: 1px solid #C0392B55; color: #C0392B; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .rest-add { background: #4A9EBF22; border: 1px solid #4A9EBF55; color: #4A9EBF; border-radius: 7px; padding: 7px 14px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .rest-dur-cfg { width: 44px; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 5px; color: #4A9EBF; padding: 4px 6px; font-size: 12px; font-weight: 700; text-align: center; }
  .rest-inp { width: 52px; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 5px; color: #4A9EBF; padding: 4px 6px; font-size: 12px; font-weight: 700; text-align: center; }

  .hist-empty { padding: 40px; text-align: center; color: #555; }
  .hist-empty-ico { font-size: 32px; margin-bottom: 12px; }
  .hist-week-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; background: #18181C; border: 1px solid #2A2A30; border-radius: 10px; padding: 14px 16px; color: #E8E6E1; font-size: 14px; margin-bottom: 8px; text-align: left; }
  .back-btn { background: none; border: none; color: #888; font-size: 13px; margin-bottom: 16px; padding: 0; display: block; }
  .hist-wk-title { font-weight: 700; font-size: 17px; margin-bottom: 16px; }
  .hist-day-card { background: #18181C; border: 1px solid #2A2A30; border-radius: 10px; padding: 14px; margin-bottom: 10px; }
  .hist-day-hdr { display: flex; gap: 10px; align-items: center; margin-bottom: 10px; }
  .hist-day-title { font-weight: 700; font-size: 14px; }
  .hist-day-muscles { font-size: 11px; color: #666; }
  .hist-ex-name { font-size: 12px; font-weight: 700; color: #C0392B; margin-bottom: 4px; }
  .hist-sets { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .hist-chip { font-size: 11px; background: #0F0F12; border: 1px solid #2A2A30; border-radius: 5px; padding: 3px 8px; color: #aaa; }
  .hist-notes { font-size: 12px; color: #666; margin-top: 8px; border-top: 1px solid #2A2A30; padding-top: 8px; }
  .run-stats { display: flex; gap: 20px; }
  .stat-lbl { font-size: 10px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
  .stat-val { font-size: 15px; font-weight: 700; }
  .tab-btn { padding: 6px 10px; }
  .mob-sec-t { font-size: 16px; font-weight: 700; }
  .mob-sec-w { font-size: 12px; color: #888; margin: 2px 0 6px; }
  .mob-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; padding: 9px 0; border-top: 1px solid #2A2A30; }
  .mob-left { min-width: 0; }
  .mob-link, .mob-name { font-size: 14px; font-weight: 600; color: #E8E6E1; }
  .mob-link { text-decoration: underline; text-decoration-color: #555; text-underline-offset: 3px; }
  .mob-note { font-size: 12px; color: #888; margin-top: 2px; }
  .mob-dose { font-size: 13px; color: #C8C6C0; white-space: nowrap; text-align: right; }
  .copy-btn { width: 100%; margin-top: 10px; padding: 12px; border-radius: 10px; background: #1E1E24; border: 1px solid #2A2A30; color: #C8C6C0; font-size: 13px; font-weight: 600; }

  /* Setup, people, plan and food */
  .header-who { background: none; border: none; padding: 0; text-align: left; display: block; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 8px 12px; border-radius: 8px; border: 1px solid #2A2A30; background: #18181C; color: #C8C6C0; font-size: 13px; font-weight: 600; }
  .chip-on { background: #E8E6E1; color: #0F0F12; border-color: #E8E6E1; }
  .q { margin-bottom: 18px; }
  .q-t { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .q-h { font-size: 12px; color: #888; margin-bottom: 8px; line-height: 1.4; }
  .primary-btn { width: 100%; padding: 14px; border-radius: 10px; border: none; background: #27AE60; color: #0F0F12; font-size: 15px; font-weight: 700; margin: 6px 0 8px; }
  .primary-btn:disabled { opacity: 0.4; }
  .link-btn { background: none; border: none; color: #4A9EBF; font-size: 13px; padding: 10px 0; display: block; }
  .row-btns { display: flex; gap: 6px; align-items: center; flex-shrink: 0; }
  .plan-day-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .plan-day-top .chip { padding: 5px 10px; font-size: 12px; }
  .plan-label { font-size: 14px; padding: 8px 10px; margin-bottom: 4px; }
  .plan-ex { border-top: 1px solid #2A2A30; padding-top: 10px; margin-top: 10px; }
  .plan-ex .ex-config-row { margin-bottom: 6px; }
  .plan-ex .range-inp, .plan-ex .rpe-target-inp { width: 40px; }
  .plan-ex .swap-btn:disabled { opacity: 0.25; }
  .plan-setup-btn { margin-top: 10px; }
  .warm { background: #18181C; border: 1px solid #2A2A30; border-radius: 10px; padding: 12px 14px; margin-bottom: 12px; }
  .warm-sum { font-size: 13px; font-weight: 700; color: #C8C6C0; cursor: pointer; }
  .warm[open] .warm-sum { margin-bottom: 6px; }
  .rest-day { font-size: 14px; color: #C8C6C0; margin-bottom: 16px; line-height: 1.5; }
  .food-p { font-size: 13px; color: #C8C6C0; line-height: 1.5; margin: 6px 0; }
  .fld-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 6px; }
  .unit-inp { display: flex; gap: 6px; }
  .unit-cell { display: flex; align-items: center; gap: 4px; flex: 1; min-width: 0; }
  .unit-cell .fld-inp { min-width: 0; padding: 9px 8px; }
  .unit-lbl { font-size: 12px; color: #888; }
  .act-opt { display: block; width: 100%; text-align: left; margin-bottom: 6px; }
  .act-d { font-size: 11px; font-weight: 400; color: #888; margin-top: 2px; }
  .chip-on .act-d { color: #555; }
  .big-kcal { font-size: 32px; font-weight: 800; margin: 2px 0; }
  .macro-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 6px; }
  .macro { background: #0F0F12; border: 1px solid #2A2A30; border-radius: 8px; padding: 10px 6px; text-align: center; }
  .macro-l { font-size: 10px; color: #888; text-transform: uppercase; letter-spacing: 1px; }
  .macro-v { font-size: 18px; font-weight: 700; margin: 2px 0; }
  .macro-k { font-size: 11px; color: #666; }
</style>
</head>
<body>
<div id="app"></div>
<script>
let PLAN = {
  Monday:    { type:"run", label:"Rest (office)",       color:"#4A9EBF", icon:"😴", muscles:"Morning mobility · Evening routine" },
  Tuesday:   { type:"gym", label:"Pull",                color:"#C0392B", icon:"💪", muscles:"Mid-back · Traps · Rear delts · Biceps · Intervals at lunch" },
  Wednesday: { type:"gym", label:"Push",                color:"#C0392B", icon:"💪", muscles:"Chest · Delts · Triceps" },
  Thursday:  { type:"gym", label:"Legs + Home Core",    color:"#C0392B", icon:"🦵", muscles:"Glutes · Quads · Hams · Core · Forearms" },
  Friday:    { type:"run", label:"Easy Run (optional)", color:"#4A9EBF", icon:"🏃", muscles:"5:45+/km · Office day" },
  Saturday:  { type:"gym", label:"Upper",               color:"#C0392B", icon:"💪", muscles:"After parkrun · Back · Chest · Delts · Arms" },
  Sunday:    { type:"gym", label:"Functional Lower",    color:"#7D3C98", icon:"🦵", muscles:"Glutes · Hams · Carries · Core · Slow run later" },
};

// Gyms: weights and kit differ, so history and hints are kept per gym
let GYMS = ["Pure Gym","Tathams"];

const HOME = [
  { name:"Home: Dead Bug (/side)",      rl:8,  rh:10, rpe:7, s:3, wj:0,   rest:45,  alts:["Band-Resisted Dead Bug","Bird Dog"] },
  { name:"Home: Reverse Crunch",        rl:10, rh:15, rpe:8, s:3, wj:0,   rest:60,  alts:["Lying Leg Raise","Bench Reverse Crunch"] },
  { name:"Home: Band Pallof (/side)",   rl:10, rh:12, rpe:7, s:2, wj:0,   rest:45,  alts:["Half-Kneeling Band Pallof"] },
  { name:"Home: Side Plank (sec)",      rl:30, rh:45, rpe:7, s:2, wj:0,   rest:45,  alts:["Knee Side Plank (sec)","Copenhagen (knee)"] },

// Targets for any exercise by name: today's plan first, then the alternatives table, then any other day
function exTargets(name, day) {
  const pick = d => d && { rl:d.rl, rh:d.rh, rpe:d.rpe||8, wj:d.wj, rest:d.rest||90 };
  const today = (DEFS[day]||[]).find(d=>d.name===name);
  if(today) return pick(today);
  if(ALTS[name]) return pick(ALTS[name]);
  for(const d of DAYS){ const m=(DEFS[d]||[]).find(x=>x.name===name); if(m) return pick(m); }
  return null;
}

// Setup note for an exercise (seat, handles, bench position) from whichever day's plan has it
function exNote(name) {
  for(const d of DAYS){ const m=(DEFS[d]||[]).find(x=>x.name===name&&x.note); if(m) return m.note; }
  if(MYPLAN&&LIBMAP[name]) return LIBMAP[name].note||"";
  return "";
}

const YT = q => "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
// Form video for an exercise card: a YouTube search on the exercise name
function exVideo(name) {
  const q = name.replace(/^Home:\s*/,"")
    .replace(/\s*\((\/side|sec|m|m\/side|sec\/side|lengths|lengths\/side)\)/g,"")
    .replace(/\bCS\b/g,"chest supported").replace(/\bDB\b/g,"dumbbell").replace(/\bKB\b/g,"kettlebell");
  return YT(q + " form");
}

function renderMobility(app){
  const content=mk("div","content"); app.appendChild(content);
  MOB.forEach(sec=>{
    const card=mk("div","ex-card");
    card.appendChild(mkT("div","mob-sec-t",sec.t));
    card.appendChild(mkT("div","mob-sec-w",sec.w));
    sec.items.forEach(it=>{
      const row=mk("div","mob-row"), left=mk("div","mob-left");
      let nm;
      if(it.u){ nm=mk("a","mob-link"); nm.href=it.u; nm.target="_blank"; nm.rel="noopener"; nm.textContent=it.n+" ▶"; }
      else nm=mkT("div","mob-name",it.n);
      left.appendChild(nm);
      if(it.x) left.appendChild(mkT("div","mob-note",it.x));
      row.appendChild(left);
      if(it.d) row.appendChild(mkT("div","mob-dose",it.d));
      card.appendChild(row);
    });
    content.appendChild(card);
  });
}

// ── Storage: each person on this phone gets their own space ──────────────────
// The original plan's data has no prefix (it was here first); people added later are kept under "u:<id>:".
let PFX = "";
function sGet(k) { try { const v=localStorage.getItem(PFX+k); return v?JSON.parse(v):null; } catch{return null;} }
function sSet(k,v) { try { localStorage.setItem(PFX+k,JSON.stringify(v)); } catch{} }
function sDel(k) { try { localStorage.removeItem(PFX+k); } catch{} }
function sList(prefix) { const r=[], p=PFX+prefix; for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.startsWith(p))r.push(k.slice(PFX.length));} return r; }
// Phone-wide settings, the same whoever is using it
function gGet(k) { try { const v=localStorage.getItem(k); return v?JSON.parse(v):null; } catch{return null;} }
function gSet(k,v) { try { localStorage.setItem(k,JSON.stringify(v)); } catch{} }

function libTargets(e, me) {
  const sc=SCHEME[me&&me.goal]||SCHEME.muscle, [rl,rh,rpe,rest]=e.c?sc.c:sc.i;
  const t={ rl, rh, rpe:me&&me.exp==="new"?Math.max(6,rpe-1):rpe, wj:e.wj, rest };
  if(e.r){ t.rl=e.r[0]; t.rh=e.r[1]; }
  return t;
}
function eqOK(e, eq) { return EQ_RANK[e.eq]<=EQ_RANK[eq||"gym"]; }
function flagged(e, me) { return e.av.filter(a=>(me.avoid||[]).includes(a)); }

// Pick the exercise for a slot: kit you have, nothing that loads an area you're nursing if there's another option,
// and a different one from earlier in the week where possible
function pickExercise(slot, me, used, taken) {
  const c=LIB.filter(e=>e.slot===slot&&eqOK(e,me.eq)&&!taken.has(e.n));
  // Bodyweight and band moves only when there's nothing better for your kit, even if it means repeating a lift
  const score=e=>(flagged(e,me).length?100:0)+(e.eq==="home"&&me.eq!=="home"?25:0)+(used[e.n]||0)*10+LIB.indexOf(e)*0.01;
  c.sort((a,b)=>score(a)-score(b));
  if(!c.length) return null;
  const pick=c[0], others=c.slice(1).sort((a,b)=>(flagged(a,me).length-flagged(b,me).length)||LIB.indexOf(a)-LIB.indexOf(b));
  return { pick, alts:others.slice(0,3).map(e=>e.n) };
}

function buildSession(kind, me, n, used) {
  const T=SESS[kind];
  const slots=T.slots.slice(), keep=new Set(), main=new Set();
  let front=0;
  (me.pri||[]).forEach(m=>{
    const opts=(PRI[m]||[]).filter(s=>T.fam.includes(SLOT[s].fam));
    if(!opts.length) return;
    main.add(opts[0]); keep.add(opts[0]);
    // Core and calves stay at the end, so they don't tire you out before the big lifts
    if(m==="core"||m==="calves"){ if(!slots.includes(opts[0])) slots.push(opts[0]); return; }
    // The main lift for a priority goes first in the session
    const i=slots.indexOf(opts[0]); if(i>=0) slots.splice(i,1);
    slots.splice(front++,0,opts[0]);
    // ...and a second exercise for it stays in, a little later
    if(opts[1]){
      if(!slots.includes(opts[1])) slots.splice(Math.min(slots.length,front+2),0,opts[1]);
      keep.add(opts[1]);
    }
  });
  // Trim to the session length, dropping the least important slots that aren't priorities
  const cap=Math.max(n,Math.min(n+1,slots.filter(s=>keep.has(s)).length));
  while(slots.length>cap){
    let j=slots.length-1; while(j>=0&&keep.has(slots[j])) j--;
    if(j<0) break; slots.splice(j,1);
  }
  const taken=new Set(), exercises=[], lbls=[];
  slots.forEach(s=>{
    const r=pickExercise(s,me,used,taken); if(!r) return;
    const e=r.pick, t=libTargets(e,me), pri=main.has(s);
    taken.add(e.n); used[e.n]=(used[e.n]||0)+1;
    const sets=Math.min(4,(me.exp==="new"&&!e.c?2:3)+(pri?1:0));
    const fl=flagged(e,me), note=[fl.length?`Go easy on your ${fl.map(a=>AREA[a]).join(" and ")}: pain-free range only`:"",e.note||""].filter(Boolean).join(" · ");
    exercises.push({ name:e.n, ...t, s:sets, alts:r.alts, note });
    if(!lbls.includes(SLOT[s].lbl)) lbls.push(SLOT[s].lbl);
  });
  const lower=T.fam.length===2&&T.fam[0]==="lower";
  return { type:"gym", kind, label:T.lbl, icon:lower?"🦵":"💪", muscles:lbls.join(" · "), exercises };
}

function buildPlan(me) {
  const gymDays=DAYS.filter(d=>(me.days||[]).includes(d)).slice(0,6);
  const kinds=SPLITS[gymDays.length]||SPLITS[3], n=PER_SESSION[me.len]||5, used={};
  const days={};
  gymDays.forEach((d,i)=>{ days[d]=buildSession(kinds[i],me,n,used); });
  // Two of the same session in a week become A and B
  const base=Object.fromEntries(gymDays.map(d=>[d,days[d].label]));
  gymDays.forEach(d=>{
    const same=gymDays.filter(x=>base[x]===base[d]);
    if(same.length>1) days[d].label=base[d]+" "+"ABC"[same.indexOf(d)];
  });
  // Runs go on the free days, spread through the week
  const free=DAYS.filter(d=>!gymDays.includes(d));
  const nRuns=Math.min(free.length,{ none:0, some:2, lots:3 }[me.run]||0);
  const runDays=[]; for(let i=0;i<nRuns;i++) runDays.push(free[Math.floor((i+0.5)*free.length/nRuns)]);
  const RUNS_L=[["Easy run","Conversational pace"],["Run","Steady, or intervals if you fancy it"],["Long easy run","Easy pace, a bit longer"]];
  runDays.forEach((d,i)=>{ days[d]={ type:"run", label:RUNS_L[i][0], icon:"🏃", muscles:RUNS_L[i][1] }; });
  free.filter(d=>!runDays.includes(d)).forEach(d=>{ days[d]={ type:"rest", label:"Rest", icon:"😴", muscles:"Walk, stretch, recover" }; });
  const gyms=(me.gyms||"").split(",").map(g=>g.trim()).filter(Boolean).slice(0,3);
  return { v:1, built:new Date().toISOString(), gyms:gyms.length?gyms:["My gym"], days };
}

// Muscles line for a gym day, from what's in it
function dayMuscles(exs) {
  const l=[]; (exs||[]).forEach(e=>{ const x=LIBMAP[e.name]; const m=x&&SLOT[x.slot].lbl; if(m&&!l.includes(m)) l.push(m); });
  return l.join(" · ");
}

      color:x.type==="gym"?"#C0392B":x.type==="run"?"#4A9EBF":"#555", muscles:x.muscles||"" };
    if(x.type==="gym") DEFS[d]=(x.exercises||[]).map(e=>({ ...e, alts:e.alts||[] }));
  });
  GYMS=pl.gyms&&pl.gyms.length?pl.gyms:["My gym"];
  ALTS={}; LIB.forEach(e=>{ ALTS[e.n]=libTargets(e,MYSETUP); });
}

function weekKey(offset=0) {
  const now=new Date(), d=now.getDay()===0?6:now.getDay()-1, mon=new Date(now);
  mon.setDate(now.getDate()-d+offset*7); return mon.toISOString().split("T")[0];
}

  return `${d.toLocaleDateString("en-GB",{day:"numeric",month:"short"})} – ${e.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`;
}

function calcHint(lastSets, rl, rh, wj) {
  if(!lastSets||!lastSets.length) return null;
  const filled=lastSets.map((s,i)=>({...s,n:i+1})).filter(s=>s.w&&s.r);
  if(!filled.length) return null;
  // Judge the weight you finished on, so ramp-up and back-off sets don't skew the hint
  const base=parseFloat(filled[filled.length-1].w);
  const work=filled.filter(s=>parseFloat(s.w)===base);
  const reps=work.map(s=>parseInt(s.r));
  const min=Math.min(...reps), allTop=reps.every(r=>r>=rh);
  if(allTop&&!wj) return {type:"harder", msg:`Top of the range at ${base}kg — make it harder: add a hold at the end or slow down`, color:"#27AE60", icon:"🏆"};
  if(allTop) return {type:"weight", msg:`↑ Increase to ${+(base+wj).toFixed(1)}kg — aim for ${rl} reps each set`, color:"#27AE60", icon:"🏆"};
  const worst=work[reps.indexOf(min)].n;
  return {type:"reps", msg:`Push for ${Math.min(min+1,rh)} reps on all sets (set ${worst} was weakest at ${min})`, color:"#F0A500", icon:"📈"};
}

let HIST = null; // all logged gym sessions, newest first; cleared on every render
function sessions() {
  if(HIST) return HIST;
  HIST = [];
  sList("logs:").forEach(k=>{
    const wk=k.slice(5), logs=wk===WK?S.logs:(sGet(k)||{});
    Object.keys(logs).forEach(day=>{
      const i=DAYS.indexOf(day);
      if(i>=0&&logs[day]&&logs[day].exercises) HIST.push({wk,i,log:logs[day]});
    });
  });
  HIST.sort((a,b)=>a.wk===b.wk?b.i-a.i:(a.wk<b.wk?1:-1));
  return HIST;
}
function sessDate(wk,i) {
  const d=new Date(wk+"T12:00:00"); d.setDate(d.getDate()+i);
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});
}
// The most recent session before the one on screen, on any day or week, where this exercise has reps logged.
// Prefers this gym; sessions logged before gyms were tracked count for either gym.
// If it has only been done at the other gym, that comes back with other:true (for reference, not hints).
function lastDone(name, gym) {
  const n=(name||"").trim().toLowerCase(); if(!n) return null;
  const cur=DAYS.indexOf(S.day);
  let other=null;
  for(const s of sessions()){
    if(s.wk>WK||(s.wk===WK&&s.i>=cur)) continue;
    const ex=s.log.exercises.find(e=>(e.name||"").trim().toLowerCase()===n);
    const sets=ex&&ex.sets||[];
    if(!sets.some(x=>x.r)) continue;
    const found={sets, when:sessDate(s.wk,s.i), gym:s.log.gym||null};
    if(!found.gym||found.gym===gym) return {...found, other:false};
    if(!other) other={...found, other:true};
  }
  return other;
}
function lastLabel(last) { return `${last.other?"Last at "+last.gym:"Last time"} (${last.when}): ${setsText(last.sets)}`; }
function setsText(sets) { return sets.filter(s=>s.r).map(s=>`${s.w?s.w+"kg":"BW"}×${s.r}`).join(", "); }

function repsCol(r,rl,rh){

function rpeCol(rpe, target) {

// ── Drag and drop (touch + mouse) ─────────────────────────────────────────────
let dragState = { src:null, srcIdx:null };

function setupDrag(handle, cardEl, ei) {
  // Touch drag
  let startY, startScroll;
  handle.addEventListener("touchstart", e => {
    dragState.src = cardEl;
    dragState.srcIdx = ei;
    startY = e.touches[0].clientY;
    cardEl.style.opacity = "0.5";
    e.stopPropagation();
  }, {passive:true});

  handle.addEventListener("touchmove", e => {
    if(dragState.src === null) return;
    const y = e.touches[0].clientY;
    // Find which card we're over
    const cards = [...document.querySelectorAll(".ex-card")];
    let overIdx = null;
    cards.forEach((c,i) => {
      const rect = c.getBoundingClientRect();
      if(y >= rect.top && y <= rect.bottom) overIdx = i;
      c.classList.remove("drag-over");
    });
    if(overIdx !== null && overIdx !== dragState.srcIdx) {
      cards[overIdx].classList.add("drag-over");
    }
    e.preventDefault();
  }, {passive:false});

  handle.addEventListener("touchend", e => {
    if(dragState.src === null) return;
    const y = e.changedTouches[0].clientY;
    const cards = [...document.querySelectorAll(".ex-card")];
    let overIdx = null;
    cards.forEach((c,i) => {
      const rect = c.getBoundingClientRect();
      if(y >= rect.top && y <= rect.bottom) overIdx = i;
      c.classList.remove("drag-over");
    });
    cardEl.style.opacity = "1";
    if(overIdx !== null && overIdx !== dragState.srcIdx) {
      mutLog(l => {
        const exs = l.exercises;
        const [moved] = exs.splice(dragState.srcIdx, 1);
        exs.splice(overIdx, 0, moved);
      });
      S.swapIdx = null;
      render();
    }
    dragState = { src:null, srcIdx:null };
  }, {passive:true});

  // Mouse drag (desktop fallback)
  handle.addEventListener("dragstart", e => {
    dragState.src = cardEl;
    dragState.srcIdx = ei;
    cardEl.classList.add("dragging");
    e.dataTransfer.effectAllowed = "move";
  });
  cardEl.addEventListener("dragover", e => { e.preventDefault(); cardEl.classList.add("drag-over"); });
  cardEl.addEventListener("dragleave", () => cardEl.classList.remove("drag-over"));
  cardEl.addEventListener("drop", e => {
    e.preventDefault();
    cardEl.classList.remove("drag-over");
    if(dragState.srcIdx !== null && dragState.srcIdx !== ei) {
      mutLog(l => {
        const exs = l.exercises;
        const [moved] = exs.splice(dragState.srcIdx, 1);
        exs.splice(ei, 0, moved);
      });
      S.swapIdx = null;
      render();
    }
  });
  cardEl.addEventListener("dragend", () => {
    cardEl.classList.remove("dragging");
    document.querySelectorAll(".ex-card").forEach(c => c.classList.remove("drag-over"));
    dragState = { src:null, srcIdx:null };
  });
  handle.setAttribute("draggable","true");
  cardEl.setAttribute("draggable","false");
}


// ── Rest Timer ────────────────────────────────────────────────────────────────
// ── Rest timer: runs off a saved end time, so it survives leaving the app ─────
const REST_KEY = 'restTimer';
let restTimer = { tick: null, to: null, end: 0, total: 0, remaining: 0, exName: '', fired: true };
const CIRC = 2 * Math.PI * 26; // circumference for r=26

}
function unlockAudio() {

      audioCtx.onstatechange = () => { if (audioCtx.state === 'running') scheduleCues(); };
    }

  } catch {}
}
document.addEventListener('pointerdown', unlockAudio, { passive: true });

// ── Countdown sounds, synthesised so no sound file is needed ──────────────────
// Digital stopwatch-style beeps (like FitNotes): 10s left: beep-beep · 3, 2, 1: short beeps · 0: two long high beeps
function beep(bus, t, f, dur, vol) {
  const g = audioCtx.createGain();
  g.gain.setValueAtTime(0, t);
  g.gain.linearRampToValueAtTime(vol, t + 0.005);
  g.gain.setValueAtTime(vol, t + dur - 0.015);
  g.gain.linearRampToValueAtTime(0, t + dur);
  g.connect(bus);
  // A few odd harmonics give it the bright, square-ish edge of a watch beep, which cuts through music
  [[1, 1], [3, 1 / 3], [5, 1 / 5]].forEach(([m, a]) => {
    const o = audioCtx.createOscillator(), h = audioCtx.createGain();
    o.frequency.value = f * m; h.gain.value = a;
    o.connect(h); h.connect(g); o.start(t); o.stop(t + dur + 0.02);
  });
}
const SOUND = {
  warn: (bus, t) => { beep(bus, t, 880, 0.12, 0.5); beep(bus, t + 0.22, 880, 0.12, 0.5); },
  bing: (bus, t) => beep(bus, t, 1046, 0.15, 0.55),
  end:  (bus, t) => { beep(bus, t, 1568, 0.5, 0.55); beep(bus, t + 0.65, 1568, 0.5, 0.55); },
};
const CUES = [[10, 'warn'], [3, 'bing'], [2, 'bing'], [1, 'bing'], [0, 'end']];

// Chrome switches the sound output off after ~30s of pure silence and takes a moment to switch it back on,
// which swallowed the first beeps (worse on Bluetooth). A signal far below hearing keeps it awake while resting.
function startKeepAlive() {
  if (keepAlive || !audioCtx || audioCtx.state !== 'running' || !audioCtx.createConstantSource) return;
  try {
    const src = audioCtx.createConstantSource();
    src.offset.value = 0.0001;
    src.connect(audioCtx.destination); src.start();
    keepAlive = src;
  } catch {}
}
function stopKeepAlive() {

}

function cancelCues() {

}
// Every cue is booked on the audio clock up front, so it lands on time even if the phone slows the app's timers
function scheduleCues() {

  startKeepAlive();
  const now = audioCtx.currentTime, left = (restTimer.end - Date.now()) / 1000;
  cueBus = audioCtx.createGain(); cueBus.connect(audioCtx.destination);
  CUES.forEach(([s, kind]) => {

    const at = left - s;
    if (at < -0.05) return; // already passed
    const t = now + Math.max(0.03, at);

    if (kind === 'end') cueEndAt = t;

// Fallback when the audio clock missed the end (audio was paused): ring now if we're still on time

}
function buzz(p) { try { if (navigator.vibrate && !document.hidden) navigator.vibrate(p); } catch {} }

// Keep the screen on while resting: a locked screen is the main reason the alert used to stay silent
async function holdScreen() {
  if (!('wakeLock' in navigator) || wakeLock || document.hidden || restTimer.fired) return;
  try {
    wakeLock = await navigator.wakeLock.request('screen');
    wakeLock.addEventListener('release', () => { wakeLock = null; });
    if (restTimer.fired) releaseScreen(); // timer ended while we were asking
  } catch { wakeLock = null; }
}
function releaseScreen() {
  const w = wakeLock; wakeLock = null;
  try { if (w) w.release(); } catch {}
}

function askNotify() {
  try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch {}
}

function saveRest() { sSet(REST_KEY, { end: restTimer.end, total: restTimer.total, exName: restTimer.exName }); }
function clearRestTimers() { clearInterval(restTimer.tick); clearTimeout(restTimer.to); }

function showRestOverlay() {
  document.getElementById('rest-overlay').classList.add('active');
  document.getElementById('rest-ex-label').textContent = restTimer.exName || 'Next set';
  document.getElementById('rest-dur-inp').value = restTimer.total;
}
function closeRestOverlay() {
  const o = document.getElementById('rest-overlay');
  if (o && restTimer.fired) o.classList.remove('active');
}

function scheduleRest() {
  clearRestTimers();

  restTimer.lastR = null;
  restTimer.tick = setInterval(restTickFn, 250);
  restTimer.to = setTimeout(restTickFn, Math.max(0, restTimer.end - Date.now()) + 20);
  swPost({ type: 'rest', end: restTimer.end, label: restTimer.exName, warn: restTimer.total >= 15 });
  scheduleCues(); holdScreen();
  restTickFn();
}

function restTickFn() {
  const ms = restTimer.end - Date.now();
  restTimer.remaining = Math.max(0, Math.ceil(ms / 1000));
  updateRestUI();
  // If the phone paused our audio mid-rest, ask for it back (the countdown is rebooked once it's running)
  if (ms > 0 && audioCtx && audioCtx.state !== 'running') audioCtx.resume().catch(() => {});
  // Buzz with the sounds: a nudge at 10s, a tick at 3, 2, 1
  const r = restTimer.remaining;
  if (r !== restTimer.lastR && !restTimer.fired && ms > 0) {
    if (restTimer.lastR != null && r === 10 && restTimer.total >= 15) buzz([100, 100, 100]);
    if (r >= 1 && r <= 3) buzz(60);

  }
  if (ms <= 0 && !restTimer.fired) {
    restTimer.fired = true;
    clearRestTimers(); releaseScreen();
    sDel(REST_KEY);
    // In the app: the end bell is already booked on the audio clock. Away from the app: the service worker notifies.
    if (!document.hidden && -ms < 5000) {
      const booked = cueEndAt > 0 && audioCtx && audioCtx.state === 'running' && audioCtx.currentTime + 0.3 >= cueEndAt;
      if (!booked) { cancelCues(); ringLate(); }
      buzz([600, 200, 600, 200, 600]);
    } else cancelCues(); // back long after the end: don't play a stale countdown
    setTimeout(closeRestOverlay, 1500);
    setTimeout(() => { if (restTimer.fired) stopKeepAlive(); }, 2500); // let the end beeps finish first
  }
}

function startRest(exName, seconds) {
  unlockAudio(); askNotify();
  restTimer.exName = exName;
  restTimer.total = seconds;
  restTimer.end = Date.now() + seconds * 1000;
  saveRest(); showRestOverlay(); scheduleRest();
}

function updateRestUI() {
  const el = document.getElementById('rest-countdown');
  const arc = document.getElementById('rest-arc');
  if (!el || !arc) return;
  el.textContent = restTimer.remaining;
  const pct = restTimer.total > 0 ? restTimer.remaining / restTimer.total : 0;
  arc.style.strokeDasharray = CIRC;
  arc.style.strokeDashoffset = CIRC * (1 - pct);
  // Colour shifts red as time runs out
  arc.style.stroke = restTimer.remaining <= 10 ? '#C0392B' : restTimer.remaining <= 20 ? '#F0A500' : '#4A9EBF';
  // Say so when sound can't play (e.g. the browser reloaded the app): one tap brings it back
  const sd = document.getElementById('rest-sound');
  if (sd) sd.hidden = !!(audioCtx && audioCtx.state === 'running');
}

function restSkip() {
  clearRestTimers();
  restTimer.fired = true;
  cancelCues(); stopKeepAlive(); releaseScreen();
  sDel(REST_KEY);
  swPost({ type: 'cancel' });
  closeRestOverlay();
}

function restAdd30() {
  if (restTimer.fired) return;
  restTimer.end += 30000;
  restTimer.total += 30;
  saveRest(); scheduleRest();
}

// Catch up instantly when you come back to the app: re-sync the countdown and keep the screen on again
document.addEventListener('visibilitychange', () => {
  if (document.hidden || restTimer.fired) return;
  restTickFn();
  if (restTimer.fired) return;
  unlockAudio(); scheduleCues(); holdScreen();
});

document.addEventListener('DOMContentLoaded', () => {
  const inp = document.getElementById('rest-dur-inp');
  if (inp) inp.addEventListener('change', () => {
    const v = parseInt(inp.value);
    if (v > 0) { restTimer.total = v; restTimer.end = Date.now() + v * 1000; saveRest(); scheduleRest(); }
  });
  // Resume a timer that was running when the app was closed
  const saved = sGet(REST_KEY);
  if (saved && saved.end > Date.now()) {
    Object.assign(restTimer, saved);
    showRestOverlay(); scheduleRest();
  } else {
    sDel(REST_KEY);
  }
});

    const isSrc=day===S.daySwapSrc, isSwapTarget=S.daySwapSrc&&day!==S.daySwapSrc;
    let cls=`day-btn${isA&&!S.daySwapSrc?" day-btn-active":""}${isL?" day-btn-logged":""}${isSrc?" day-btn-swap-src":""}${isSwapTarget?" day-btn-swap-target":""}`;
    const b=mk("div",cls);
    b.style.setProperty("--dc",p2.color);
    b.appendChild(mkT("div","day-lbl"+(isT?" day-lbl-today":""),day.slice(0,3).toUpperCase()));
    b.appendChild(mkT("div","day-ico",p2.icon));
    b.appendChild(mkT("div","day-nm",p2.label.split(" ")[0]));

    // Long-press to start swap mode
    let pressTimer=null;
    b.addEventListener("touchstart",()=>{
      pressTimer=setTimeout(()=>{ S.daySwapSrc=day; render(); },500);
    },{passive:true});
    b.addEventListener("touchend",()=>clearTimeout(pressTimer),{passive:true});
    b.addEventListener("touchmove",()=>clearTimeout(pressTimer),{passive:true});
    // Mouse long-press fallback
    b.addEventListener("mousedown",()=>{ pressTimer=setTimeout(()=>{ S.daySwapSrc=day; render(); },500); });
    b.addEventListener("mouseup",()=>clearTimeout(pressTimer));

    b.onclick=()=>{
      if(S.daySwapSrc) {
        if(S.daySwapSrc===day) { S.daySwapSrc=null; render(); return; }
        // Perform swap — swap the log entries for both days
        const a=S.daySwapSrc, bDay=day;
        const logA=S.logs[a]||null, logB=S.logs[bDay]||null;
        if(logA) S.logs[bDay]=logA; else delete S.logs[bDay];
        if(logB) S.logs[a]=logB; else delete S.logs[a];
        sSet(`logs:${WK}`,S.logs);
        S.day=bDay; S.daySwapSrc=null; S.swapIdx=null;
        render(); return;
      }
      S.day=day; S.swapIdx=null; render();
    };
    strip.appendChild(b);
  });
  app.appendChild(strip);

  const sh=mk("div","sess-hdr");
  const sico=mk("div","sess-ico"); sico.style.background=`color-mix(in srgb,${p.color} 13%,transparent)`; sico.textContent=p.icon;
  const sinfo=mk("div");
  sinfo.appendChild(mkT("div","sess-title",p.label));
  if(p.muscles) sinfo.appendChild(mkT("div","sess-muscles",p.muscles));
  sh.append(sico,sinfo); app.appendChild(sh);

  const content=mk("div","content"); app.appendChild(content);
  if(p.type==="run") renderRun(content);
  else if(p.type==="rest") renderRest(content);
  else renderGym(content,p);

  const saveBtn=mkT("div","auto-saved-indicator","✓ Changes saved automatically");
  content.appendChild(saveBtn);
  const cp=mkT("button","copy-btn","Copy workout as text");
  cp.onclick=()=>copyText(workoutText(), cp);
  content.appendChild(cp);
}

function workoutText() {
  const p=PLAN[S.day], log=getLog();
  const d=new Date(WK); d.setDate(d.getDate()+DAYS.indexOf(S.day));
  const lines=[`${d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})} — ${p.label}${log.exercises?" @ "+sessionGym(log):""}`];
  if(!log.exercises){
    lines.push(`Run: ${log.distance||"—"} km, ${log.duration||"—"} min`);
  } else {
    log.exercises.forEach(ex=>{
      const sets=(ex.sets||[]).filter(s=>s.w||s.r).map(s=>`${s.w||"BW"}×${s.r||"?"}${s.rpe?"@"+s.rpe:""}`);
      if(!sets.length) return;
      const tgt=ex.rl?` (${ex.rl}${ex.rh&&ex.rh!==ex.rl?"–"+ex.rh:""}, RPE ${ex.rpe||"—"})`:"";
      lines.push(`${ex.name||"Exercise"}${tgt}: ${sets.join(", ")}`);
    });
    if(lines.length===1) lines.push("Nothing logged yet");
  }
  if(log.notes) lines.push(`Notes: ${log.notes}`);
  return lines.join("\n");
}
function copyText(text, btn) {
  const done=()=>{ const t=btn.textContent; btn.textContent="Copied ✓"; setTimeout(()=>btn.textContent=t,1500); };
  if(navigator.clipboard&&navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(()=>fallback());
  else fallback();
  function fallback(){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch{} ta.remove(); }
}

function renderRun(container) {

    inp.addEventListener("change",()=>{ mutLog(l=>l[key]=inp.value); });

}

  container.appendChild(addEx);

// ── Runs: plan, Strava runs and effort read from heart rate ───────────────────
// Weekly run plan. pace is the target range in seconds per km; zone is the target heart-rate zone range.
const RUN_PLAN = [
  { days:["Tuesday"], label:"Intervals", detail:"10 min easy, 6 × 800m with 2 min jog or walk recoveries, 10 min easy", pace:[260,265], zone:[4,5], rpe:"8", kind:"intervals" },
  { days:["Saturday","Sunday"], label:"Hold-pace run", detail:"Parkrun on Saturday or 6–8 km on Sunday · first km easy", pace:[300,310], zone:[3,3], rpe:"6", kind:"hold" },
  { days:["Friday"], label:"Easy run", detail:"Optional · 30–40 min", pace:[345,375], zone:[1,2], rpe:"3", kind:"easy", optional:true },
];
// Weeks that differ from the usual plan, keyed by the Monday they start on
const RUN_WEEKS = {
  "2026-10-05": [
    { days:["Tuesday"], label:"Easy + strides", detail:"Time trial week · 30 min easy then 4 × 20s strides", pace:[345,375], zone:[1,2], rpe:"3", kind:"easy" },
    { days:["Saturday"], label:"5K time trial", detail:"Parkrun as the test · 10 min warm-up with strides", pace:[240,270], zone:[4,5], rpe:"9", kind:"test" },
    { days:["Sunday"], label:"Recovery run", detail:"Optional · easy, 20–30 min", pace:[345,390], zone:[1,2], rpe:"2–3", kind:"easy", optional:true },
  ],
};
const ZONE_RPE = {1:"2–3",2:"3–4",3:"5–6",4:"7–8",5:"9–10"};

// Strava runs: runs.json next to the app (kept for offline) or a file imported on this device; newest wins
let RUNS = sGet("runsData");
function setRuns(d) {
  if(!d||!Array.isArray(d.runs)) return false;
  if(RUNS&&RUNS.updated&&d.updated&&d.updated<RUNS.updated) return false;
  RUNS=d; sSet("runsData",d); return true;
}
if(CLASSIC) fetch("runs.json",{cache:"no-store"}).then(r=>r.ok?r.json():null).then(d=>{ if(setRuns(d)&&S.view==="runs") render(); }).catch(()=>{});

function fmtPace(s) { s=Math.round(s); return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
function runPace(r) { return r.sec/r.km; }
function hrZone(hr) {
  if(!hr||!RUNS||!RUNS.hrZones) return null;
  const z=RUNS.hrZones.findIndex(top=>hr<=top);
  return z<0?5:z+1;
}
function weekOf(date) { // Monday of the week a YYYY-MM-DD date falls in
  const d=new Date(date+"T12:00:00"), i=d.getDay()===0?6:d.getDay()-1;
  d.setDate(d.getDate()-i); return d.toISOString().split("T")[0];
}
function dayOf(date) { const d=new Date(date+"T12:00:00").getDay(); return DAYS[d===0?6:d-1]; }

function hardRun(r) { return r.slot&&(r.slot.kind==="intervals"||r.slot.kind==="test"); }
// Pace per heartbeat, compared with your recent non-interval runs: a big drop means HR ran high for the pace
function hrDrift(run, all) {
  const eff=r=>r.hr?(1000/runPace(r))/r.hr:null;
  const prev=all.filter(r=>r.date<run.date&&r.hr&&!hardRun(r)).slice(0,6).map(eff).sort((a,b)=>a-b);
  if(prev.length<3||!eff(run)) return null;
  const med=prev[Math.floor(prev.length/2)];
  return eff(run)/med-1;
}

function runVerdict(run, slot, all) {
  const z=hrZone(run.hr), pace=runPace(run), notes=[];
  let tone="ok";
  if(slot&&z){
    if(z>slot.zone[1]){ tone=z>slot.zone[1]+1?"bad":"warn"; notes.push(`HR in zone ${z}, above the zone ${slot.zone[1]} target. ${slot.kind==="easy"?"Slow down 15–20 s/km next time.":"Ease off about 10 s/km."}`); }
    else if(z<slot.zone[0]&&slot.kind!=="easy") notes.push(`HR only reached zone ${z}, so there's room to push a little more.`);
    else notes.push(`HR in zone ${z}, on target.`);
  }
  if(slot&&slot.kind!=="intervals"&&pace<slot.pace[0]-5) notes.push(`Pace ${fmtPace(pace)}/km is quicker than the ${fmtPace(slot.pace[0])}–${fmtPace(slot.pace[1])} target.`);
  const drift=hardRun(run)?null:hrDrift(run,all);
  if(drift!==null&&drift<-0.05){ if(tone==="ok") tone="warn"; notes.push("HR was high for this pace compared with your recent runs. Tired, hot or under-recovered? Keep the next run easy."); }
  if(run.spm&&run.spm<160) notes.push(`Cadence ${run.spm} spm. Aim for 165+ with shorter, quicker steps.`);
  return {tone, z, notes};
}

function renderRuns(app){
  const content=mk("div","content"); app.appendChild(content);
  const all=(RUNS&&RUNS.runs||[]).slice().sort((a,b)=>a.date<b.date?1:-1);
  all.forEach(r=>{ r.week=weekOf(r.date); r.day=dayOf(r.date); r.slot=null; });

  const weeksSeen={};
  all.slice().reverse().forEach(r=>{
    const taken=weeksSeen[r.week]||(weeksSeen[r.week]=new Set());
    r.slot=(RUN_WEEKS[r.week]||RUN_PLAN).find(s=>s.days.includes(r.day)&&!taken.has(s))||null;
    if(r.slot) taken.add(r.slot);
  });

  // This week: plan slots and the runs done for them
  const slots=RUN_WEEKS[WK]||RUN_PLAN, used=new Set(), thisWeek=all.filter(r=>r.week===WK);
  const plan=mk("div","ex-card");
  plan.appendChild(mkT("div","mob-sec-t","This week's runs"));
  plan.appendChild(mkT("div","mob-sec-w",RUN_WEEKS[WK]?"Time trial week":"Your usual week"));
  slots.forEach(slot=>{
    const run=thisWeek.find(r=>r.slot===slot&&!used.has(r));
    if(run) used.add(run);
    const row=mk("div","mob-row"), left=mk("div","mob-left");
    left.appendChild(mkT("div","mob-name",`${slot.label}${slot.optional?" (optional)":""}`));
    left.appendChild(mkT("div","mob-note",`${slot.days.map(d=>d.slice(0,3)).join(" or ")} · ${slot.detail}`));
    left.appendChild(mkT("div","mob-note",`Target ${fmtPace(slot.pace[0])}–${fmtPace(slot.pace[1])}/km · zone ${slot.zone[0]===slot.zone[1]?slot.zone[0]:slot.zone.join("–")} · RPE ${slot.rpe}`));
    row.appendChild(left);
    row.appendChild(mkT("div","run-status "+(run?"run-done":""),run?`✓ ${run.km.toFixed(1)} km`:"To do"));
    plan.appendChild(row);
  });
  content.appendChild(plan);

  if(!all.length){
    content.appendChild(mkT("div","hist-empty","No Strava runs loaded yet."));
    return;
  }

  // Recent runs with effort read from heart rate
  const list=mk("div","ex-card");
  list.appendChild(mkT("div","mob-sec-t","Recent runs"));
  list.appendChild(mkT("div","mob-sec-w","Effort read from heart rate. Zones come from Strava."));
  all.slice(0,8).forEach(run=>{
    const slot=run.slot;
    const v=runVerdict(run,slot,all);
    const row=mk("div","run-row run-"+v.tone);
    const top=mk("div","run-top");
    top.appendChild(mkT("span","mob-name",`${sessDate(run.week,DAYS.indexOf(run.day))} · ${slot?slot.label:"Run"}`));
    top.appendChild(mkT("span","mob-dose",`${run.km.toFixed(1)} km · ${fmtPace(runPace(run))}/km`));
    row.appendChild(top);
    const stats=[run.hr?`Avg HR ${run.hr}${v.z?` (zone ${v.z}, feels like RPE ${ZONE_RPE[v.z]})`:""}`:"No heart rate", run.spm?`${run.spm} spm`:""].filter(Boolean).join(" · ");
    row.appendChild(mkT("div","mob-note",stats));
    v.notes.forEach(n=>row.appendChild(mkT("div","run-note",n)));
    list.appendChild(row);
  });
  content.appendChild(list);

  // Weekly volume, to keep it flat
  const weeks=[]; for(let i=5;i>=0;i--) weeks.push(weekKey(-i));
  const km=weeks.map(w=>all.filter(r=>r.week===w).reduce((t,r)=>t+r.km,0));
  const max=Math.max(...km,1);
  const vol=mk("div","ex-card");
  vol.appendChild(mkT("div","mob-sec-t","Weekly volume"));
  vol.appendChild(mkT("div","mob-sec-w","Keep it roughly flat from week to week"));
  weeks.forEach((w,i)=>{
    const row=mk("div","vol-row");
    row.appendChild(mkT("span","vol-lbl",new Date(w+"T12:00:00").toLocaleDateString("en-GB",{day:"numeric",month:"short"})));
    const bar=mk("div","vol-bar"), fill=mk("div","vol-fill"); fill.style.width=`${km[i]/max*100}%`; bar.appendChild(fill);

// ── Backup: every logged week in one JSON file ───────────────────────────────
// Personal plan, setup answers and food details travel with the logs
const EXTRA_KEYS=["plan","me","nutrition"];
function exportBackup() {
  const data={};
  sList("logs:").forEach(k=>{ const v=sGet(k); if(v) data[k]=v; });
  const setup=sGet(SETUP_KEY); if(setup&&Object.keys(setup).length) data[SETUP_KEY]=setup;
  EXTRA_KEYS.forEach(k=>{ const v=sGet(k); if(v) data[k]=v; });
  const json=JSON.stringify({app:"bulk-log",version:1,exported:new Date().toISOString(),name:ME&&ME.name||"",data});
  const who=ME&&ME.name?ME.name.toLowerCase().replace(/[^a-z0-9]+/g,"-")+"-":"";
  const name=`bulk-log-backup-${who}${new Date().toISOString().split("T")[0]}.json`;
  const file=new File([json],name,{type:"application/json"});
  const done=()=>{ sSet("lastBackup",Date.now()); render(); };
  const download=()=>{
    const a=document.createElement("a"); a.href=URL.createObjectURL(file); a.download=name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1000); done();
  };
  // On a phone the share sheet saves to Files or Drive; elsewhere it downloads
  if(matchMedia("(pointer:coarse)").matches&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:name}).then(done).catch(e=>{ if(!e||e.name!=="AbortError") download(); });
  } else download();
}
function importBackup(file) {
  const rd=new FileReader();
  rd.onload=()=>{
    let b; try{ b=JSON.parse(rd.result); }catch{ alert("That file isn't a Bulk Log backup."); return; }
    const data=b&&b.data&&typeof b.data==="object"?b.data:b;
    const keys=Object.keys(data||{}).filter(k=>/^logs:\d{4}-\d{2}-\d{2}$/.test(k)&&data[k]&&typeof data[k]==="object");
    const setup=data&&data[SETUP_KEY]&&typeof data[SETUP_KEY]==="object"?data[SETUP_KEY]:null;
    const nSetup=setup?Object.keys(setup).length:0;
    const extra=EXTRA_KEYS.filter(k=>data&&data[k]&&typeof data[k]==="object"&&(k!=="plan"||(MYPLAN&&data.plan.days)));
    if(!keys.length&&!nSetup&&!extra.length){
      if(b&&Array.isArray(b.runs)){ RUNS=null; setRuns(b); render(); alert(`Loaded ${b.runs.length} Strava runs.`); return; }
      alert("No workout weeks found in that file."); return;
    }
    const what=[keys.length&&`${keys.length} week${keys.length>1?"s":""}`,nSetup&&`${nSetup} setup note${nSetup>1?"s":""}`,extra.includes("plan")&&"your plan"].filter(Boolean).join(" and ")||"your details";
    const when=b.exported?` from ${new Date(b.exported).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}`:"";
    if(!confirm(`Restore ${what}${when}?\n\nWeeks and setup notes in the backup replace the same ones on this device. Everything else is kept.`)) return;
    keys.forEach(k=>sSet(k,data[k]));
    if(nSetup) sSet(SETUP_KEY,{...(sGet(SETUP_KEY)||{}),...setup});
    extra.forEach(k=>sSet(k,data[k]));
    if(extra.includes("plan")){ MYSETUP=sGet("me")||MYSETUP; applyPlan(sGet("plan")); }
    S.logs=sGet(`logs:${WK}`)||{};
    S.histWeeks=sList("logs:").map(k=>k.replace("logs:","")).filter(k=>k!==WK).sort().reverse();
    render();
    alert(`Restored ${what}.`);
  };
  rd.readAsText(file);
}

function submitSetup() {
  const d=SETUP.d; if(!d.days.length) return;
  d.name=(d.name||"").trim();
  if(SETUP.mode==="edit"){
    if(!confirm("Rebuild your plan from these answers?\n\nYour history stays. Changes you made in Plan are replaced.")) return;
    const pr=PROFILES.list.find(p=>p.id===ME.id); if(pr){ pr.name=d.name; gSet("profiles",PROFILES); }
  } else {
    // A new person, or someone whose plan went missing
    let pr=SETUP.mode==="first"&&PROFILES.list.find(p=>p.id===PROFILES.active&&!p.classic);
    if(!pr){ pr={ id:newId(), name:"" }; PROFILES.list.push(pr); }
    pr.name=d.name||(PROFILES.list.length>1?`Person ${PROFILES.list.length}`:"");
    PROFILES.active=pr.id; gSet("profiles",PROFILES);
    PFX=`u:${pr.id}:`;
  }
  sSet("me",d); sSet("plan",buildPlan(d)); sSet("justBuilt",1);
  reloadTop();
}

function restoreFirst(file) {
  const rd=new FileReader();
  rd.onload=()=>{
    let b; try{ b=JSON.parse(rd.result); }catch{ alert("That file isn't a Bulk Log backup."); return; }
    const data=b&&b.data&&typeof b.data==="object"?b.data:b;
    const keys=Object.keys(data||{}).filter(k=>(/^logs:\d{4}-\d{2}-\d{2}$/.test(k)||k===SETUP_KEY||EXTRA_KEYS.includes(k))&&data[k]&&typeof data[k]==="object");
    if(!keys.length){ alert("No workout weeks found in that file."); return; }
    let pr;
    if(data.plan&&data.plan.days){ pr={ id:newId(), name:String(b.name||"").trim().slice(0,20) }; PFX=`u:${pr.id}:`; }
    else {
      // A backup without a personal plan is from the original plan
      if(PROFILES.list.some(p=>p.classic)){ alert("This phone already has the original plan. Switch to it and restore there."); return; }
      pr={ id:"me", name:"", classic:true }; PFX="";
    }
    keys.forEach(k=>sSet(k,data[k]));
    PROFILES.list.push(pr); PROFILES.active=pr.id; gSet("profiles",PROFILES);
    reloadTop();
  };
  rd.readAsText(file);
}

    r2.appendChild(numInp("range-inp",e.s,"3",v=>set("s",Math.max(1,Math.min(10,v||1)))));
    r2.appendChild(mkT("span","ex-config-label","Reps"));
    r2.appendChild(numInp("range-inp",e.rl,"8",v=>set("rl",v)));
    r2.appendChild(mkT("span","range-sep","–"));
    r2.appendChild(numInp("range-inp",e.rh,"12",v=>set("rh",v)));
    r2.appendChild(mkT("span","ex-config-label","RPE"));
    r2.appendChild(numInp("rpe-target-inp",e.rpe,"8",v=>set("rpe",v)));
    row.appendChild(r2);
    // Rest, then move up or down
    const r3=mk("div","ex-config-row");
    r3.appendChild(mkT("span","ex-config-label","Rest"));
    r3.appendChild(numInp("rest-dur-cfg",e.rest,"90",v=>set("rest",v||90)));
    r3.appendChild(mkT("span","ex-config-label","s"));
    const mv=mk("div","ex-actions");
    const up=mkT("button","swap-btn","↑ Up"), dn=mkT("button","swap-btn","↓ Down");
    up.disabled=i===0; dn.disabled=i===x.exercises.length-1;
    const move=dir=>{ planMut(p=>{ const a=p.days[d].exercises; const [m]=a.splice(i,1); a.splice(i+dir,0,m); }); render(); };
    up.onclick=()=>move(-1); dn.onclick=()=>move(1);
    mv.append(up,dn); r3.appendChild(mv);
    row.appendChild(r3);
    card.appendChild(row);
  });
  const add=mkT("button","add-set-btn","+ Add exercise");
  add.onclick=()=>{ planMut(p=>p.days[d].exercises.push({ name:"", rl:8, rh:12, rpe:8, s:3, wj:2.5, rest:90, alts:[], note:"" })); render(); };
  card.appendChild(add);
  return card;
}

// From the Week view: today's exercises, sets and targets become the plan for this day
function keepAsPlan() {
  const log=getLog(), defs=DEFS[S.day]||[];
  planMut(p=>{
    const day=p.days[S.day]; if(!day||day.type!=="gym") return;
    day.exercises=(log.exercises||[]).filter(e=>(e.name||"").trim()).map(e=>{
      const def=defs.find(x=>x.name===e.name||(x.alts||[]).includes(e.name)), L=LIBMAP[e.name];
      return { name:e.name, rl:e.rl, rh:e.rh, rpe:e.rpe, wj:e.wj??2.5, rest:e.rest||90, s:Math.max(1,(e.sets||[]).length),
        alts:def?[def.name,...(def.alts||[])].filter(n=>n!==e.name).slice(0,4):libAlts(e.name),
        note:def&&def.name===e.name?def.note||"":(L&&L.note)||"" };
    });
  });
}
// Typing a library exercise into a card fills in its targets
function fillFromLib(ei, name) {
  const L=LIBMAP[(name||"").trim()]; if(!L) return;
  const t=libTargets(L,MYSETUP);
  mutLog(l=>{ Object.assign(l.exercises[ei],{ rl:t.rl, rh:t.rh, rpe:t.rpe, wj:t.wj, rest:t.rest }); });
  render();
}

// Warm-up for a personal plan's gym day, from what's in the session
function warmupEl(day) {
  const x=MYPLAN.days[day]||{}, me=MYSETUP||{}, pri=me.pri||[], av=me.avoid||[];
  const fams=new Set((DEFS[day]||[]).map(e=>LIBMAP[e.name]&&SLOT[LIBMAP[e.name].slot].fam).filter(Boolean));
  const lower=fams.has("lower")||x.kind&&/full|lower|legs/.test(x.kind), upper=fams.has("push")||fams.has("pull");
  const items=[["Easy cardio","5 min","Bike, rower or a brisk walk · RPE 3",null]];
  if(lower){
    items.push(["Glute bridge","1×12","Squeeze 2s at the top",YT("glute bridge form")]);
    if(pri.includes("glutes")) items.push(["Banded clamshell","1×12/side","Hips stacked, don't roll back",YT("banded clamshell form")],
      ["Mini-band lateral walk","1×10 steps each way","Small steps, toes forward",YT("mini band lateral walk form")]);
    items.push(["Leg swings","10 each way/leg","Hold on to something for balance",YT("leg swings warm up")]);
    if(av.includes("knee")) items.push(["Knee-to-wall ankle mobility","5/side","",YT("knee to wall ankle mobilization")]);
    if(av.includes("back")) items.push(["Dead bug","1×8/side","Sets the lower back before loading",YT("dead bug exercise form")]);
  }
  if(upper){
    items.push(["Band pull-apart","1×15","Arms straight out in front",YT("band pull apart form")]);
    items.push(["Band external rotation","1×15/side","Elbow tucked at your side",YT("band external rotation elbow at side")]);
  }
  items.push(["Ramp-up sets on the first lift","~50%×8, ~75%×5","Light sets that don't count · 60s rest",null]);
  const det=mk("details","warm"); det.open=!!S.warmOpen;
  det.addEventListener("toggle",()=>{ S.warmOpen=det.open; });
  det.appendChild(mkT("summary","warm-sum","Warm-up · about 8 minutes"));
  items.forEach(([n,dose,note,u])=>{
    const row=mk("div","mob-row"), left=mk("div","mob-left");
    let nm;
    if(u){ nm=mk("a","mob-link"); nm.href=u; nm.target="_blank"; nm.rel="noopener"; nm.textContent=n+" ▶"; }
    else nm=mkT("div","mob-name",n);
    left.appendChild(nm);
    if(note) left.appendChild(mkT("div","mob-note",note));
    row.append(left,mkT("div","mob-dose",dose));
    det.appendChild(row);
  });
  return det;
}

function renderRest(container) {
  const log=getLog();
  container.appendChild(mkT("div","rest-day","Rest day. Recovery is when you get stronger: a walk, some stretching, or nothing at all."));
  container.appendChild(mkT("div","fld-lbl","Notes"));
  const ta=mk("textarea","notes-ta"); ta.placeholder="Sleep, soreness, steps, anything to remember..."; ta.value=log.notes||"";
  ta.addEventListener("change",()=>{ mutLog(l=>l.notes=ta.value); });
  container.appendChild(ta);
}

// ── Food: calories and macros from your details and goal ──────────────────────
const ACT=[
  [1.2,"Mostly sitting","Desk job, little or no exercise"],
  [1.375,"Lightly active","Desk job and 1–3 workouts a week"],
  [1.55,"Moderately active","Desk job and 4–5 workouts, or on your feet with 2–3"],
  [1.725,"Very active","6+ workouts a week, or a physical job and regular training"],
  [1.9,"Extremely active","Physical job and hard training most days"],
];
const NGOAL={ lose:"Lose fat", maintain:"Maintain", lean:"Lean bulk", bulk:"Bulk" };
function foodDefaults() {
  const me=MYSETUP||{}, n=DAYS.filter(d=>PLAN[d]&&PLAN[d].type!=="rest"&&!/rest/i.test(PLAN[d].label)).length;
  return { units:"metric", sex:"", age:"", cm:"", kg:"", bf:"", act:n<=3?1.375:n<=5?1.55:1.725,
    goal:{ fatloss:"lose", fitness:"maintain" }[me.goal]||"lean", pace:"steady" };
}
// Calories: Mifflin-St Jeor, or Katch-McArdle when body fat is known · protein in g per kg (per kg lean mass if known)
function foodCalc(n) {
  const age=+n.age, cm=+n.cm, kg=+n.kg, bf=+n.bf;
  if(!n.sex||!(age>=18&&age<=90&&cm>=120&&cm<=230&&kg>=35&&kg<=250)) return null;
  const lbm=bf>=4&&bf<=60?kg*(1-bf/100):null;
  const bmr=lbm?370+21.6*lbm:10*kg+6.25*cm-5*age+(n.sex==="m"?5:-161);
  const tdee=bmr*n.act;
  let kcal=tdee, wk=0, floor=false;
  if(n.goal==="lose"){
    const pct={ gentle:0.004, steady:0.006, fast:0.009 }[n.pace]||0.006;
    kcal=tdee-Math.min(pct*kg*7700/7,tdee*0.25); // no more than a quarter below maintenance
    if(kcal<bmr){ kcal=bmr; floor=true; }
    wk=(tdee-kcal)*7/7700;
  } else if(n.goal==="lean") kcal=tdee*1.1;
  else if(n.goal==="bulk") kcal=tdee*1.2;
  kcal=Math.round(kcal/50)*50;
  const m=cm/100, ref=kg/(m*m)>30?25*m*m:kg; // above a BMI of 30, protein is based on a BMI-25 weight
  const prot=lbm?{ lose:2.6, maintain:2.4, lean:2.3, bulk:2.2 }[n.goal]*lbm:{ lose:2.2, maintain:2.0, lean:2.0, bulk:1.8 }[n.goal]*ref;
  const P=Math.round(prot/5)*5, F=Math.round(Math.max(kcal*0.25/9,0.6*kg)/5)*5, C=Math.max(0,Math.round((kcal-P*4-F*9)/4/5)*5);
  return { bmr:Math.round(bmr), tdee:Math.round(tdee/10)*10, kcal, P, F, C, water:Math.round(kg*0.035*10)/10, wk, floor, lbm, kg };
}
function fmtW(kg, units) {
  if(units==="imperial"){ const lb=kg/0.453592; return `${lb<10?lb.toFixed(1):Math.round(lb)} lb`; }
  return `${kg<10?(Math.round(kg*10)/10).toFixed(1):Math.round(kg)} kg`;
}

function renderFood(app) {
  const content=mk("div","content"); app.appendChild(content);
  const n={ ...foodDefaults(), ...(sGet("nutrition")||{}) };
  const save=()=>sSet("nutrition",n);
  const imp=n.units==="imperial";

  const card=mk("div","ex-card");
  card.appendChild(mkT("div","mob-sec-t","Your details"));
  card.appendChild(mkT("div","mob-sec-w","Used to estimate what you burn in a day. Saved on this phone only."));
  const sec=(t,el)=>{ const w=mk("div","q"); w.appendChild(mkT("div","fld-lbl",t)); w.appendChild(el); card.appendChild(w); return w; };
  sec("Units",chipsEl([["metric","kg and cm"],["imperial","st, lb, ft and in"]],v=>n.units===v,v=>{ n.units=v; save(); }));
  sec("Sex (for the calorie formula)",chipsEl([["m","Male"],["f","Female"]],v=>n.sex===v,v=>{ n.sex=v; save(); }));

  const out=mk("div");
  const upd=()=>{ save(); fillFood(out,n); };
  const field=(label,inputs)=>{ const w=mk("div"); w.appendChild(mkT("div","fld-lbl",label)); const r=mk("div","unit-inp"); inputs.forEach(x=>r.appendChild(x)); w.appendChild(r); return w; };
  const ni=(val,ph,on,unit)=>{ const i=mk("input","fld-inp"); i.type="number"; i.inputMode="decimal"; i.value=val; i.placeholder=ph;
    i.addEventListener("input",()=>{ on(i.value); upd(); }); const w=mk("div","unit-cell"); w.append(i,mkT("span","unit-lbl",unit)); return w; };
  const grid=mk("div","fld-row");
  grid.appendChild(field("Age",[ni(n.age,"30",v=>n.age=v,"yrs")]));
  if(imp){
    const tin=n.cm?n.cm/2.54:0, ft=n.cm?Math.floor(tin/12):"", inch=n.cm?Math.round(tin-ft*12):"";
    const ftI=ni(ft,"5",v=>setH(),"ft"), inI=ni(inch,"10",v=>setH(),"in");
    const setH=()=>{ const f=+ftI.firstChild.value||0, i=+inI.firstChild.value||0; n.cm=f||i?Math.round((f*12+i)*2.54*10)/10:""; };
    grid.appendChild(field("Height",[ftI,inI]));
    const tlb=n.kg?n.kg/0.453592:0, st=n.kg?Math.floor(tlb/14):"", lb=n.kg?Math.round(tlb-st*14):"";
    const stI=ni(st,"12",v=>setW(),"st"), lbI=ni(lb,"6",v=>setW(),"lb");
    const setW=()=>{ const s=+stI.firstChild.value||0, l=+lbI.firstChild.value||0; n.kg=s||l?Math.round((s*14+l)*0.453592*10)/10:""; };
    grid.appendChild(field("Weight",[stI,lbI]));
  } else {
    grid.appendChild(field("Height",[ni(n.cm,"178",v=>n.cm=v,"cm")]));
    grid.appendChild(field("Weight",[ni(n.kg,"80",v=>n.kg=v,"kg")]));
  }
  grid.appendChild(field("Body fat (optional)",[ni(n.bf,"18",v=>n.bf=v,"%")]));
  card.appendChild(grid);
  card.appendChild(mkT("div","q-h","Know your body fat from a scan, callipers or a smart scale? It makes the estimate more accurate. Leave it blank if not."));

  const act=mk("div");
  ACT.forEach(([k,t,dsc])=>{
    const b=mk("button","chip act-opt"+(n.act===k?" chip-on":""));
    b.append(mkT("div","",t),mkT("div","act-d",dsc));
    b.onclick=()=>{ n.act=k; save(); render(); };
    act.appendChild(b);
  });
  sec("How active are you?",act);
  sec("Goal",chipsEl(Object.entries(NGOAL),v=>n.goal===v,v=>{ n.goal=v; save(); }));
  if(n.goal==="lose") sec("How fast?",chipsEl([["gentle","Gentle"],["steady","Steady"],["fast","Faster"]],v=>n.pace===v,v=>{ n.pace=v; save(); }));
  content.appendChild(card);

  const res=mk("div","ex-card"); res.appendChild(out); content.appendChild(res);
  fillFood(out,n);

  const how=mk("div","ex-card");
  how.appendChild(mkT("div","mob-sec-t","How to use it"));
  ["Hit your protein every day. Calories can average out over the week, so a bigger training day and a lighter rest day is fine.",
   "Weigh yourself most mornings and compare 7-day averages every 2 weeks.",
   "Off track? Change by about 150 kcal a day, mostly from carbs or fat, and keep protein the same.",
   "These are estimates for healthy adults. If you're pregnant, managing a health condition or have a history of eating disorders, talk to a GP or dietitian first."
  ].forEach(t=>how.appendChild(mkT("div","food-p",t)));
  content.appendChild(how);
}

function fillFood(out, n) {
  out.innerHTML="";
  const r=foodCalc(n), imp=n.units==="imperial";
  if(!r){
    out.appendChild(mkT("div","mob-sec-t","Your daily targets"));
    out.appendChild(mkT("div","mob-note",n.age&&+n.age<18?"This calculator is for adults (18 and over).":"Fill in sex, age, height and weight to see your targets."));
    return;
  }
  out.appendChild(mkT("div","fld-lbl","Your daily targets"));
  out.appendChild(mkT("div","big-kcal",`${r.kcal.toLocaleString("en-GB")} kcal`));
  const adj={ lose:"for steady fat loss", maintain:"to hold your weight", lean:"plus 10% for a lean bulk", bulk:"plus 20% for a bulk" }[n.goal];
  out.appendChild(mkT("div","mob-note",`You burn about ${r.tdee.toLocaleString("en-GB")} kcal a day · this is ${n.goal==="maintain"?"that amount":adj}`));
  const g=mk("div","macro-grid");
  [["Protein",r.P,4],["Carbs",r.C,4],["Fat",r.F,9]].forEach(([l,v,k])=>{
    const c=mk("div","macro");
    c.append(mkT("div","macro-l",l),mkT("div","macro-v",`${v} g`),mkT("div","macro-k",`${(v*k).toLocaleString("en-GB")} kcal`));
    g.appendChild(c);
  });
  out.appendChild(g);
  const rate=n.goal==="lose"?`Expect to lose about ${fmtW(r.wk,n.units)} a week`
    :n.goal==="lean"?`Expect to gain about ${fmtW(r.kg*0.005,n.units)}–${fmtW(r.kg*0.01,n.units)} a month`
    :n.goal==="bulk"?`Expect to gain about ${fmtW(r.kg*0.01,n.units)}–${fmtW(r.kg*0.02,n.units)} a month`
    :"Expect your weight to hold steady";
  out.appendChild(mkT("div","food-p",rate));
  out.appendChild(mkT("div","mob-note",`Fibre 30 g · water about ${r.water} litres, more on training days`));
  if(r.floor) out.appendChild(mkT("div","mob-note","Kept at your resting burn so it doesn't go too low. Lose fat with more activity rather than eating less than this."));
  out.appendChild(mkT("div","mob-note",r.lbm?`Based on your lean mass (${fmtW(r.lbm,n.units)}) and ${Math.round(r.P/r.lbm*10)/10} g protein per kg of it`
    :`Protein is ${Math.round(r.P/r.kg*10)/10} g per kg of body weight`));
}

// Exercise names to pick from when typing one in
(()=>{ const dl=mk("datalist"); dl.id="exlib"; LIB.forEach(e=>{ const o=mk("option"); o.value=e.n; dl.appendChild(o); }); document.body.appendChild(dl); })();

render();
</script>
